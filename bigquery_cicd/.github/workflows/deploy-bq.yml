name: BigQuery CI/CD

on:
  pull_request:
    paths:
      - "bigquery_cicd/bq/**"
      - "bigquery_cicd/config/**"
      - "bigquery_cicd/.github/workflows/deploy-bq.yml"

  push:
    branches:
      - "feature/bq/sample-table-cicd"
    paths:
      - "bigquery_cicd/bq/**"
      - "bigquery_cicd/config/**"
      - "bigquery_cicd/.github/workflows/deploy-bq.yml"

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-dry-run:
    name: Validate and Dry Run
    runs-on: ubuntu-24.04   # Pinned to avoid ubuntu-latest migration to Ubuntu 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/450158463415/locations/global/workloadIdentityPools/github-actions-pool/providers/github"
          service_account: "450158463415-compute@developer.gserviceaccount.com"

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3  # Updated from v2 to fix Node.js 20 deprecation

      - name: Validate SQL file (local structural checks)
        run: |
          python bigquery_cicd/bq/scripts/validate_schema.py

      - name: BigQuery dry run (syntax & permission check)
        run: |
          bq query \
            --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            --use_legacy_sql=false \
            --dry_run \
            < bigquery_cicd/bq/schemas/sample_customers.sql

  deploy-table:
    name: Deploy BigQuery Table
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-dry-run
    runs-on: ubuntu-24.04   # Pinned to avoid ubuntu-latest migration to Ubuntu 26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/450158463415/locations/global/workloadIdentityPools/github-actions-pool/providers/github"
          service_account: "450158463415-compute@developer.gserviceaccount.com"

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3  # Updated from v2 to fix Node.js 20 deprecation

      - name: Create dataset if needed
        run: |
          bq --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            mk --dataset \
            --location=US \
            --description="Dataset for CI/CD BigQuery demonstration" \
            "${{ secrets.GCP_PROJECT_ID }}:cicd_demo" || true

      - name: Deploy BigQuery table
        run: |
          bq query \
            --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            --use_legacy_sql=false \
            < bigquery_cicd/bq/schemas/sample_customers.sql

      - name: Verify table
        run: |
          bq show \
            --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            "${{ secrets.GCP_PROJECT_ID }}:cicd_demo.sample_customers"