name: BigQuery CI/CD

on:
  pull_request:
    paths:
      - "bq/**"
      - "config/**"
      - ".github/workflows/deploy-bq.yml"

  push:
    branches:
      - main
    paths:
      - "bq/**"
      - "config/**"
      - ".github/workflows/deploy-bq.yml"

jobs:
  validate-and-dry-run:
    name: Validate and Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate SQL file
        run: |
          python bq/scripts/validate_schema.py

      - name: BigQuery dry run
        run: |
          bq query \
            --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            --use_legacy_sql=false \
            --dry_run \
            < bq/schemas/sample_customers.sql

  deploy-table:
    name: Deploy BigQuery Table
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-dry-run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Create dataset if needed
        run: |
          bq --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            mk --dataset \
            --location=US \
            --description="Dataset for CI/CD BigQuery demonstration" \
            "${{ secrets.GCP_PROJECT_ID }}:cicd_demo" || true

      - name: Deploy BigQuery table
        run: |
          bq query \
            --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            --use_legacy_sql=false \
            < bq/schemas/sample_customers.sql

      - name: Verify table
        run: |
          bq show \
            --project_id="${{ secrets.GCP_PROJECT_ID }}" \
            "${{ secrets.GCP_PROJECT_ID }}:cicd_demo.sample_customers"