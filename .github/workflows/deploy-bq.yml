name: BigQuery CI/CD

on:
  pull_request:
    paths:
      - "bigquery_cicd/bq/**"
      - "bigquery_cicd/config/**"
      - ".github/workflows/deploy-bq.yml"

  push:
    branches:
      - "feature/bq/sample-table-cicd"
    paths:
      - "bigquery_cicd/bq/**"
      - "bigquery_cicd/config/**"
      - ".github/workflows/deploy-bq.yml"

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  BQ_DATASET: cicd_demo
  BQ_LOCATION: US

jobs:
  validate-and-dry-run:
    name: Validate and Dry Run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bigquery_cicd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: bq

      - name: Validate SQL file
        run: |
          python bq/scripts/validate_schema.py

      - name: BigQuery dry run
        run: |
          bq query \
            --project_id="${{ env.GCP_PROJECT_ID }}" \
            --use_legacy_sql=false \
            --dry_run \
            < bq/schemas/sample_customers.sql

  deploy-table:
    name: Deploy BigQuery Table
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/bq/sample-table-cicd'
    needs: validate-and-dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bigquery_cicd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: bq

      - name: Create dataset if needed
        run: |
          bq --project_id="${{ env.GCP_PROJECT_ID }}" \
            mk --dataset \
            --location=${{ env.BQ_LOCATION }} \
            --description="Dataset for CI/CD BigQuery demonstration" \
            "${{ env.GCP_PROJECT_ID }}:${{ env.BQ_DATASET }}" || true

      - name: Deploy BigQuery table
        run: |
          bq query \
            --project_id="${{ env.GCP_PROJECT_ID }}" \
            --use_legacy_sql=false \
            < bq/schemas/sample_customers.sql

      - name: Verify table
        run: |
          bq show \
            --project_id="${{ env.GCP_PROJECT_ID }}" \
            "${{ env.GCP_PROJECT_ID }}:${{ env.BQ_DATASET }}.sample_customers"
